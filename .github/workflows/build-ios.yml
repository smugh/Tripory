name: Build iOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export iOS Bundle
        run: npx expo export --platform ios --output-dir dist/ios

      - name: Upload iOS Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tripory-v1.0.0-ios-bundle
          path: dist/ios/
